<!DOCTYPE html>
<!--
  The page a shared level link lands on.

  Copy this to the site repository (code3b/code3b.github.io) as /l/index.html.
  It is kept here because it is part of the sharing design, and the design is
  only correct if the app, the link format and this page agree.

  WHAT IT IS FOR
  The app claims https://code3b.github.io/l/ with an intent filter, so on a phone
  with the game installed this page is usually never seen: Android opens the game
  instead. It exists for everybody else -- somebody on a desktop, somebody
  without the game, or somebody whose Android has not verified the link yet.

  WHY THE LEVEL IS AFTER THE '#'
  A fragment is never sent to the server. GitHub Pages never sees which level was
  shared, and this page cannot leak it. It is also the reason a level can travel
  in the link at all with no backend: the app reads the fragment out of the
  intent, which the browser cannot do for us.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A level in The Neon Arrows</title>
<meta name="description" content="Somebody built you a level. Clear every arrow.">

<!--
  ⚠️ **This is how a shared level gets a picture.** Every chat app that shows a
  link preview fetches this page and reads these tags; without them a level
  arrives as a bare grey card next to a URL, which is the least appealing form a
  share can take.

  Attaching a real image to the share intent instead would be worse. Several
  apps drop EXTRA_TEXT once EXTRA_STREAM is present, and the text is where the
  link lives — so the picture would arrive and the level would not. A preview
  card cannot lose the link, because the link is what summoned it.

  ⚠️ The card cannot show the actual board. The level id lives in the fragment
  and a fragment never reaches a server, which is the property the whole sharing
  design rests on — so the scraper sees this page and no level. A generic card
  is the cost of the level staying between the two people sharing it.

  Absolute URLs: scrapers do not resolve relative ones.
-->
<meta property="og:title" content="Somebody built you a level">
<meta property="og:description" content="Clear every arrow — but an arrow can only leave if nothing is in its way. Open it in The Neon Arrows.">
<meta property="og:image" content="https://code3b.github.io/assets/banner.jpg">
<meta property="og:image:width" content="1400">
<meta property="og:image:height" content="683">
<meta property="og:url" content="https://code3b.github.io/l/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #0b0d10;
    --raised: #151a20;
    --ink: #e8edf2;
    --muted: #8b97a5;
    --accent: #8ef04f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 420px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: .01em; }
  p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
  .board {
    width: 168px; height: 168px;
    margin: 0 auto 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .cell { background: var(--raised); border-radius: 8px; }
  .get {
    display: inline-block;
    padding: 14px 28px;
    border: 1px solid var(--accent);
    border-radius: 12px;
    color: var(--accent);
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
  }
  .open { display: block; margin-top: 16px; color: var(--muted); font-size: 13px; }
  code {
    display: block;
    margin-top: 28px;
    padding: 10px;
    background: var(--raised);
    border-radius: 8px;
    color: var(--muted);
    font-size: 11px;
    word-break: break-all;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="board" aria-hidden="true">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  </div>

  <h1>Somebody built you a level</h1>
  <p id="blurb">
    Clear every arrow &mdash; but an arrow can only leave if nothing is in its way.
  </p>

  <a class="get" id="get"
     href="https://play.google.com/store/apps/details?id=com.code3b.theneonarrows">
    GET THE GAME
  </a>
  <a class="open hidden" id="open" href="#">Open it in the game</a>

  <code id="fallback" class="hidden"></code>
</main>

<script>
(function () {
  var fragment = (location.hash || '').replace(/^#/, '').trim();
  var get = document.getElementById('get');
  var open = document.getElementById('open');

  if (!fragment) {
    document.getElementById('blurb').textContent =
      'This link is missing its level. Ask whoever sent it to share it again.';
    return;
  }

  // ⚠️ **An intent link, and this is what fixes "it goes to the store even
  // though I have the game".** Until assetlinks.json is published, Android has
  // not verified this domain, so a tap opens the browser and lands here even on
  // a phone with the app installed. An intent:// URL is the one thing a web page
  // can do about that: Chrome hands off to the named package if it is there, and
  // follows browser_fallback_url if it is not.
  //
  // The level rides as ?id= rather than in the fragment, because the intent
  // syntax spends the fragment on itself. The app understands both.
  // ⚠️ market:// for the visible button, https for the fallback, and the
  // difference is not cosmetic. A tap on market:// opens the Play app with no
  // chooser, which is what somebody pressing GET THE GAME should get. But Chrome
  // accepts only http or https in browser_fallback_url and ignores the rest, so
  // the automatic hand-off has to use the https form or it does not happen at
  // all -- which is what it was doing.
  //
  // The https form is also the desktop button, where market:// resolves to
  // nothing.
  var web = 'https://play.google.com/store/apps/details?id=com.code3b.theneonarrows';
  var play = 'market://details?id=com.code3b.theneonarrows';
  if (fragment.length <= 100) {
    // Play's referrer is capped at 100 characters, so a whole board in the link
    // is far too long for it. A short id fits, which is one more reason
    // publishing beats packing the board into the URL.
    var referrer = '&referrer=' + encodeURIComponent('level=' + fragment);
    play += referrer;
    web += referrer;
  }
  get.href = /android/i.test(navigator.userAgent) ? play : web;

  var deepLink =
    'intent://code3b.github.io/l/?id=' + encodeURIComponent(fragment) +
    '#Intent;scheme=https;package=com.code3b.theneonarrows;' +
    // ⚠️ **The https Play URL, never market://.** Chrome accepts only http or
    // https in browser_fallback_url and silently ignores anything else -- so a
    // market:// fallback meant that somebody without the game tapped a level
    // link, landed here, and stayed here. Nothing opened, and nothing said why.
    //
    // The referrer rides along, which is the point of using a URL at all rather
    // than letting Chrome fall back to the store on its own: without it the
    // level is forgotten during the install and the game opens on level one.
    'S.browser_fallback_url=' + encodeURIComponent(web) + ';end';

  open.href = deepLink;
  open.textContent = 'Open it in the game';
  open.classList.remove('hidden');

  // ⚠️ **Try the app first, and never redirect straight to the store.** The
  // first version sent every Android visitor to Play after a beat, which is
  // exactly the reported bug: somebody who already had the game was pushed to
  // its store page instead of into it. The intent link cannot make that mistake
  // -- Chrome only follows the fallback when the package is genuinely absent.
  if (/android/i.test(navigator.userAgent)) {
    setTimeout(function () { location.replace(deepLink); }, 1200);
  }

  // Shown last and quietly: on a desktop there is nothing to open, and the code
  // is the only thing that survives being copied to a phone by hand.
  var fallback = document.getElementById('fallback');
  fallback.textContent = fragment;
  fallback.classList.remove('hidden');
}());
</script>
</body>
</html>
